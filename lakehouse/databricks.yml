bundle:
  name: wiener

variables:
  catalog:
    default: workspace
  schema:
    default: wiener
  timezone:
    default: America/Bogota
  alert_email:
    description: Job failure email (from .env ALERT_EMAIL via BUNDLE_VAR_alert_email)

targets:
  dev:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/wiener

resources:
  schemas:
    wiener:
      catalog_name: ${var.catalog}
      name: ${var.schema}

  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.wiener.name}
      name: landing
    gold_export:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.wiener.name}
      name: gold_export

  pipelines:
    wiener_medallion:
      name: wiener_medallion
      catalog: ${var.catalog}
      schema: ${resources.schemas.wiener.name}
      serverless: true
      continuous: false
      channel: CURRENT
      configuration:
        wiener.landing_path: /Volumes/${var.catalog}/${var.schema}/landing
        wiener.timezone: ${var.timezone}
      libraries:
        - file:
            path: ./src/pipeline.py

  jobs:
    wiener_lakehouse:
      name: wiener_lakehouse
      trigger:
        file_arrival:
          url: /Volumes/${var.catalog}/${var.schema}/landing/
          min_time_between_triggers_seconds: 600
          wait_after_last_change_seconds: 120
      email_notifications:
        on_failure:
          - ${var.alert_email}
      environments:
        - environment_key: default
          spec:
            client: "2"
      tasks:
        - task_key: medallion
          pipeline_task:
            pipeline_id: ${resources.pipelines.wiener_medallion.id}
        - task_key: export_gold
          depends_on:
            - task_key: medallion
          environment_key: default
          spark_python_task:
            python_file: ./src/export_gold.py
            parameters:
              - ${var.catalog}
              - ${var.schema}
              - /Volumes/${var.catalog}/${var.schema}/gold_export
